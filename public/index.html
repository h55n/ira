<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2713%27 fill=%27%23c8ef8a%27/%3E%3C/svg%3E">
<title>Ira - Hinglish voice receptionist</title>
<meta name="description" content="Ira answers every call in Hinglish, books the right slot and confirms on WhatsApp. Live demo.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--page:#f3f5f9;--ink:#1c2530;--mute:#8d96a3;--soft:#eef1f6;--line:#e6e9f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;display:flex;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
#app{flex:1;display:flex;min-width:0;height:100%}
#chat{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;position:relative;max-width:760px;margin:0 auto;width:100%}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 18px 8px;position:relative;z-index:3;background:linear-gradient(#fff 55%,rgba(255,255,255,0))}
.ti{display:flex;flex-direction:column;align-items:center;gap:1px}
.ti strong{font-size:15px;font-weight:600}
.ti span{font-size:11.5px;color:var(--mute);display:block;height:14px;transition:color .2s}
.ti span.on{color:#f09a6c}
.dot{display:none}
.orb{position:relative;width:34px;height:34px;justify-self:start}
.orb b{display:none}
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;transition:opacity .5s}
.orb::before{background:radial-gradient(circle at 35% 30%,#f7ffa8,#d3f08c 45%,#a9e5a4 85%);filter:blur(5px);animation:morph 7s ease-in-out infinite}
.orb::after{opacity:0;background:radial-gradient(circle at 50% 70%,rgba(255,255,255,.95),rgba(255,222,208,.7) 55%,rgba(255,176,128,.6));border:1.5px solid rgba(255,170,100,.7);box-shadow:inset 0 -6px 12px rgba(255,120,150,.3);animation:morph 3s ease-in-out infinite}
.orb.think::before{opacity:0}.orb.think::after{opacity:1}
@keyframes morph{0%,100%{border-radius:50% 50% 50% 50%;transform:rotate(0) scale(1)}25%{border-radius:56% 44% 52% 48%;transform:rotate(60deg) scale(1.04)}50%{border-radius:46% 54% 44% 56%;transform:rotate(140deg) scale(.97)}75%{border-radius:52% 48% 58% 42%;transform:rotate(250deg) scale(1.03)}}
#memtoggle{justify-self:end;border:0;background:var(--soft);color:var(--ink);border-radius:999px;height:34px;padding:0 13px;font:inherit;font-size:13px;font-weight:500;display:flex;gap:7px;align-items:center;cursor:pointer;transition:background .2s,transform .15s}
#memtoggle:hover{background:#e4e8f0}#memtoggle:active{transform:scale(.95)}
.pill{background:var(--ink);color:#fff;border-radius:999px;font-size:11px;font-weight:600;min-width:19px;height:19px;line-height:19px;text-align:center;padding:0 5px}
#feed{flex:1;overflow-y:auto;padding:30px 26px 190px;scroll-behavior:smooth;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent 0,#000 110px);mask-image:linear-gradient(transparent 0,#000 110px)}
#feed::-webkit-scrollbar{display:none}
.hero{min-height:calc(100% - 20px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:34px;animation:fade .8s ease both}
.hero .big{width:150px;height:150px;position:relative;margin-top:-30px}
.hero .big::before{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#f4ff98,#d0f08a 48%,#a6e6a8 85%);filter:blur(20px);animation:morph 8s ease-in-out infinite}
.hero .big b{display:none}
.hero h2{display:none}
.hero p{margin:0;font-size:16.5px;line-height:1.5;color:#2b3542;max-width:290px;font-weight:400}
.row{margin:0 0 22px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.row.mid{margin-top:-8px}
.lab{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);margin-bottom:7px;font-weight:400}
.lab svg{width:13px;height:13px}
.row.mid .lab{display:none}
.m{font-size:21px;line-height:1.32;font-weight:600;letter-spacing:-.022em;color:var(--ink);overflow-wrap:anywhere;max-width:100%}
.row.u .m{color:#1c2530}
.row.a .m{color:#232d3a}
.m p{margin:0 0 8px}.m p:last-child{margin:0}
.m ul{margin:4px 0 6px;padding-left:20px}
.time{display:none}
.glass{width:46px;height:46px;position:relative;margin:2px 0 0 2px}
.glass i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 72%,rgba(255,255,255,.95),rgba(255,224,210,.72) 55%,rgba(255,178,130,.62));border:1.5px solid rgba(255,170,100,.65);box-shadow:inset 0 -8px 16px rgba(255,120,150,.28),0 8px 22px rgba(255,170,120,.28);animation:morph 2.6s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sys{display:flex;justify-content:center;margin:6px 0 24px;animation:fade .5s ease both}
.sys span{font-size:12px;color:var(--mute);background:var(--soft);border-radius:999px;padding:6px 12px}
#dock{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,255,255,0),#fff 42%);z-index:3}
#chips{display:flex;gap:8px;overflow-x:auto;padding:28px 2px 12px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;border:0;background:var(--soft);color:#3a4553;font:inherit;font-size:13.5px;font-weight:500;border-radius:999px;padding:9px 15px;cursor:pointer;transition:background .18s,transform .15s}
#chips button:hover{background:#e3e8f1;transform:translateY(-1px)}
form{display:flex;flex-direction:column;gap:6px;padding:16px 14px 12px 18px;background:#fff;border-radius:26px;box-shadow:0 0 0 1px rgba(120,160,230,.14),0 10px 34px rgba(110,160,255,.20),0 2px 6px rgba(20,30,50,.05);transition:box-shadow .25s}
form:focus-within{box-shadow:0 0 0 1.5px rgba(120,160,230,.35),0 12px 40px rgba(110,160,255,.30),0 2px 6px rgba(20,30,50,.05)}
textarea{resize:none;max-height:120px;padding:0;border:0;font:inherit;font-size:16px;outline:none;background:transparent;color:var(--ink);line-height:1.45;min-height:24px;letter-spacing:-.01em}
textarea::placeholder{color:#a0a8b4;font-weight:400}
.bar{display:flex;align-items:center;gap:10px}
#plus{width:38px;height:38px;border:0;border-radius:50%;background:var(--soft);color:#2b3542;display:grid;place-items:center;cursor:pointer;flex:none;transition:background .2s,transform .15s}
#plus:hover{background:#e3e8f1}#plus:active{transform:scale(.92)}
#plus svg{width:18px;height:18px}
#hint{font-weight:400;flex:1;font-size:13.5px;color:#a0a8b4;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden}
#hint svg{width:16px;height:16px;flex:none}
#send{width:38px;height:38px;border:0;border-radius:50%;background:#1b2630;color:#fff;cursor:pointer;flex:none;display:grid;place-items:center;transition:transform .15s,opacity .2s}
#send svg{width:18px;height:18px}
#send:hover{transform:scale(1.07)}#send:active{transform:scale(.92)}#send:disabled{opacity:.3}
#mem{width:320px;border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column;z-index:4;transition:transform .35s cubic-bezier(.2,.9,.2,1),visibility .35s}
#mem .mh{display:flex;align-items:center;padding:22px 20px 4px;gap:10px}
#mem h3{margin:0;font-size:18px;font-weight:650;flex:1;letter-spacing:-.02em}
#mem small{display:block;padding:0 20px 14px;color:var(--mute);font-size:13px;line-height:1.45}
#memlist{flex:1;overflow-y:auto;padding:2px 16px 20px;margin:0;list-style:none;scrollbar-width:none}
#memlist li{font-size:14.5px;line-height:1.4;padding:13px 14px;border-radius:16px;background:var(--soft);margin-bottom:9px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start;animation:rise .35s ease both;font-weight:480}
#memlist li.new{background:linear-gradient(120deg,#f2ffc2,#d5f5c5);animation:rise .35s ease both}
#memlist li button{background:none;border:0;color:#a0a8b4;cursor:pointer;font-size:18px;line-height:1;padding:0 3px}
#memlist li button:hover{color:#e0556a}
#empty{padding:34px 24px;color:var(--mute);font-size:14px;text-align:center;line-height:1.5}
#close{display:none;border:0;background:var(--soft);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
#scrim{display:none}
@media(min-width:701px){body{background:var(--page)}#chat{background:#fff;box-shadow:0 0 60px rgba(20,30,60,.06)}}
@media(max-width:700px){
  #mem{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:78vh;border:0;border-radius:28px 28px 0 0;transform:translateY(120%);visibility:hidden;box-shadow:0 -20px 60px rgba(20,30,60,.25)}
  #mem::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:#d8dde6;margin:10px auto 0}
  body.memopen #mem{transform:none;visibility:visible}
  body.memopen #scrim{display:block;position:fixed;inset:0;background:rgba(20,30,50,.28);z-index:3;animation:fade .25s ease both}
  #close{display:block}
  #feed{padding-left:22px;padding-right:22px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- motion + gradient layer ---- */
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
body::before{content:"";position:fixed;left:-20%;right:-20%;bottom:-30%;height:60%;pointer-events:none;z-index:0;background:radial-gradient(ellipse 40% 50% at 30% 70%,rgba(214,244,150,.28),transparent 70%),radial-gradient(ellipse 40% 50% at 72% 80%,rgba(160,200,255,.26),transparent 70%);animation:ambient 14s ease-in-out infinite alternate}
@keyframes ambient{from{transform:translateX(-4%) scale(1)}to{transform:translateX(5%) scale(1.12)}}
#app{position:relative;z-index:1}
/* hero orb: layered blobs */
.hero .big{width:170px;height:170px;animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.hero .big::before{inset:8px;background:radial-gradient(circle at 36% 30%,#faffb0 0%,#dcf58f 38%,#b5ea9c 70%,#9fe3b8 100%);filter:blur(22px);animation:morph 8s ease-in-out infinite,hue 12s ease-in-out infinite alternate}
.hero .big::after{content:"";position:absolute;inset:34px 10px 6px 40px;border-radius:50%;background:radial-gradient(circle at 60% 60%,rgba(150,225,215,.75),rgba(190,240,150,.0) 70%);filter:blur(20px);animation:morph 11s ease-in-out infinite reverse,drift 9s ease-in-out infinite alternate}
.hero .big b{display:block;position:absolute;inset:22px 36px 44px 12px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(255,255,200,.95),rgba(246,255,160,0) 70%);filter:blur(16px);animation:morph 9s ease-in-out infinite,drift 7s ease-in-out infinite alternate-reverse}
@keyframes hue{from{filter:blur(22px) hue-rotate(-12deg) saturate(1)}to{filter:blur(22px) hue-rotate(14deg) saturate(1.15)}}
@keyframes drift{from{transform:translate(-8px,-4px)}to{transform:translate(10px,8px)}}
.hero p{animation:rise .9s var(--ease) .25s both}
#chips button{animation:rise .55s var(--ease) both}
#chips button:nth-child(2){animation-delay:.07s}#chips button:nth-child(3){animation-delay:.14s}#chips button:nth-child(4){animation-delay:.21s}
#chips button:active{transform:scale(.95)}
/* header orb */
.orb::before{background:radial-gradient(circle at 35% 30%,#faffb0,#d6f28e 42%,#a9e6a6 80%,#9fe3c0);animation:morph 7s ease-in-out infinite,hue 10s ease-in-out infinite alternate}
.orb::after{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 28%),conic-gradient(from 0deg,#ffd9c2,#ffb48a,#ff9fb4,#ffd2e0,#ffe3cf,#ffb48a,#ffd9c2);border:1.5px solid rgba(255,160,100,.75);box-shadow:inset 0 -6px 12px rgba(255,110,150,.28),0 0 16px rgba(255,170,120,.5);animation:morph 3s ease-in-out infinite,spin 5s linear infinite}
@keyframes spin{to{filter:hue-rotate(25deg)}}
.orb.think{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.ti span{opacity:0;transform:translateY(3px);transition:opacity .3s var(--ease),transform .3s var(--ease),color .2s}
.ti span.on{opacity:1;transform:none}
/* typing glass orb */
.glass{animation:rise .4s var(--ease) both}
.glass i{background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.98) 0,rgba(255,255,255,0) 30%),conic-gradient(from 0deg,#ffe0cc,#ffbf99,#ffa9bd,#ffd6e4,#ffe8d6,#ffbf99,#ffe0cc);border:1.5px solid rgba(255,165,100,.7);box-shadow:inset 0 -9px 16px rgba(255,110,150,.25),inset 0 0 12px rgba(255,255,255,.7),0 10px 26px rgba(255,170,120,.38);animation:morph 2.4s ease-in-out infinite,spin 4s linear infinite alternate}
.glass::after{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(255,180,130,.35),transparent 65%);animation:pulse 1.6s ease-in-out infinite;z-index:-1}
.glass{isolation:isolate}
/* messages */
.row{animation:rise .6s var(--ease) both}
.row.u .m{animation:rise .5s var(--ease) both}
.m p{animation:wordin .5s var(--ease) both}
@keyframes wordin{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sys span{animation:rise .5s var(--ease) both}
/* composer */
form{position:relative;transition:box-shadow .35s var(--ease),transform .35s var(--ease)}
form::before{content:"";position:absolute;inset:-2px;border-radius:28px;z-index:-1;background:linear-gradient(120deg,rgba(214,244,150,.0),rgba(214,244,150,.0));opacity:0;transition:opacity .4s}
form:focus-within{transform:translateY(-2px)}
form:focus-within::before{opacity:1;background:linear-gradient(120deg,#d9f59a,#9fe3d0,#a9c8ff,#d9f59a);background-size:300% 300%;animation:ring 4s linear infinite;filter:blur(10px);opacity:.55}
@keyframes ring{to{background-position:300% 0}}
form{isolation:isolate;background:#fff}
#plus{transition:background .2s,transform .35s var(--spring)}
#plus:hover{transform:rotate(90deg)}
body.memopen #plus{transform:rotate(45deg);background:#1b2630;color:#fff}
#send{background:linear-gradient(145deg,#2a3744,#141c24);transition:transform .3s var(--spring),opacity .25s,box-shadow .3s,background .3s;box-shadow:0 4px 12px rgba(20,28,36,.25)}
#send:not(:disabled):hover{transform:scale(1.1);box-shadow:0 6px 18px rgba(20,28,36,.35)}
form.empty #send{background:#dfe4ec;box-shadow:none;color:#fff}
form.empty #send:hover{transform:none}
#send svg{transition:transform .45s var(--spring)}
#send.go svg{animation:fly .5s var(--ease)}
@keyframes fly{0%{transform:translateY(0)}45%{transform:translateY(-22px);opacity:0}46%{transform:translateY(22px);opacity:0}100%{transform:none;opacity:1}}
#hint svg{animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.5;transform:scale(.9) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}
/* memory */
#memtoggle .pill.bump{animation:bump .5s var(--spring)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
#mem{transition:transform .5s var(--ease),visibility .5s}
#memlist li{animation:rise .5s var(--ease) both}
#memlist li:nth-child(2){animation-delay:.04s}#memlist li:nth-child(3){animation-delay:.08s}#memlist li:nth-child(4){animation-delay:.12s}#memlist li:nth-child(5){animation-delay:.16s}#memlist li:nth-child(6){animation-delay:.2s}
#memlist li.new{background:linear-gradient(110deg,#f4ffc4,#d3f6cf,#f4ffc4);background-size:250% 100%;animation:rise .5s var(--ease) both,shine 2.2s ease-out 1}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
#memlist li button{transition:transform .2s var(--spring),color .2s}
#memlist li button:hover{transform:scale(1.3) rotate(90deg)}
#memtoggle{transition:background .2s,transform .3s var(--spring)}

/* ---- UX audit fixes ---- */
:root{--mute:#667080;--ph:#6c7685}
/* contrast: muted text raised to >=4.5:1 on white; placeholder >=4.2:1 */
textarea::placeholder{color:var(--ph)}
#hint{color:var(--mute)}
.lab{color:var(--mute);font-size:13px}
.ti span{color:var(--mute)}
.ti span.on{color:#b0521e}
.sys span{color:#58626f}
#mem small,#empty{color:#586271}
/* touch targets >= 44px (Fitts) */
#plus,#send{width:44px;height:44px}
#memtoggle{height:44px;padding:0 15px}
#chips button{min-height:44px;padding:0 17px}
#close{min-height:44px;padding:0 18px}
#memlist li button{min-width:44px;min-height:44px;margin:-12px -10px -12px 0;display:grid;place-items:center;font-size:20px}
.orb{width:36px;height:36px}
/* spacing rhythm: 4/8 scale */
#feed{padding:32px 24px 200px}
.row{margin-bottom:24px}
.lab{margin-bottom:8px}
form{gap:8px;padding:16px 12px 12px 20px}
#chips{gap:8px;padding:28px 2px 12px}
/* keyboard + focus visibility (accessibility heuristic) */
button:focus-visible,textarea:focus-visible{outline:2px solid #4f86f7;outline-offset:2px}
textarea:focus-visible{outline:none}
/* readable measure and line length on desktop */
.m{max-width:34em}
/* state clarity: disabled send while busy shows progress, not just fade */
#send:disabled{opacity:1;background:#cfd6e0;cursor:progress}
/* hover only where hover exists */
@media(hover:none){#chips button:hover,#send:hover,#plus:hover,#memtoggle:hover{transform:none}}
form::before{z-index:-2}
form::after{content:"";position:absolute;inset:0;border-radius:26px;background:#fff;z-index:-1}
form:focus-within::before{opacity:.5;inset:-3px}
@keyframes hue2{from{filter:blur(5px) hue-rotate(-12deg)}to{filter:blur(5px) hue-rotate(14deg)}}
.orb::before{animation:morph 7s ease-in-out infinite,hue2 10s ease-in-out infinite alternate}

/* ---- detail pass ---- */
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:inherit}
.m{text-wrap:pretty;hanging-punctuation:first}
.hero p{text-wrap:balance}
textarea{caret-color:#4f86f7;scrollbar-width:none}
#feed{padding-bottom:calc(var(--dock,190px) + 16px);overscroll-behavior:contain;scroll-padding-bottom:var(--dock,190px)}
#memlist,#mem{overscroll-behavior:contain}
#memlist{scrollbar-width:thin;scrollbar-color:#d5dae3 transparent}
.pill{font-variant-numeric:tabular-nums;padding:0 6px}
.lab svg{margin-top:-1px;flex:none}
.lab{letter-spacing:0;line-height:1}
.row.u .lab{padding-left:1px}
.row.mid{margin-top:-12px}
.m p+p{margin-top:12px}
.m p{margin-bottom:0}
header{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
.ti strong{letter-spacing:-.01em;font-size:16px}
form{border-radius:28px}
form::after{border-radius:28px}
#hint{min-width:0}
#hinttxt{overflow:hidden;text-overflow:ellipsis}
#plus,#send,#memtoggle,#chips button,#close{transition-timing-function:var(--ease)}
#send:active,#plus:active{transform:scale(.9);transition-duration:.1s}
#memtoggle:active{transform:scale(.96)}
#memlist li{transition:opacity .22s var(--ease),transform .22s var(--ease),max-height .26s var(--ease),margin .26s var(--ease),padding .26s var(--ease);max-height:200px;overflow:hidden}
#memlist li.out{opacity:0;transform:translateX(24px);max-height:0;margin-bottom:0;padding-top:0;padding-bottom:0}
#empty{display:none;padding:48px 28px}
#empty::before{content:"";display:block;width:56px;height:56px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#faffb0,#d6f28e 45%,#a9e6a6);filter:blur(6px);animation:morph 7s ease-in-out infinite}
@media(max-width:360px){.m{font-size:19px}.hero .big{width:140px;height:140px}#memtoggle{padding:0 12px}#feed{padding-left:20px;padding-right:20px}}
@media(min-width:701px){.m{font-size:22px}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#d5dae3;border-radius:3px}
@media(max-width:430px){.mw{display:none}#memtoggle{padding:0 14px;gap:8px}.hr{gap:6px}}

/* calling motion + sound toggle */
.orb{position:relative}
.orb.call{border-radius:50%;animation:pulse 1.1s ease-in-out infinite,ripple 1.5s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(130,205,90,.45)}100%{box-shadow:0 0 0 16px rgba(130,205,90,0)}}
.orb.speak{animation:speak .55s ease-in-out infinite}
@keyframes speak{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.orb.squish{animation:squish .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes squish{0%{transform:scale(1)}35%{transform:scale(.86,1.1)}100%{transform:scale(1)}}
#status em::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite;overflow:hidden;vertical-align:bottom}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
#snd{border:0;background:none;color:#8a96a3;font:600 13px Inter,sans-serif;margin-right:10px;padding:6px 2px;cursor:pointer;transition:color .2s}
#snd[aria-pressed=true]{color:#1c2530}
.mh{align-items:center}

/* voice call */
.hr{justify-self:end;display:flex;align-items:center;gap:8px}
#callbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .3s var(--spring)}
#callbtn:hover{background:#dff3b8}#callbtn:active{transform:scale(.92)}
#callui{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(56px + env(safe-area-inset-top)) 24px calc(36px + env(safe-area-inset-bottom));background:radial-gradient(ellipse 80% 50% at 50% 38%,#eaf9cf,#fff 70%);opacity:0;visibility:hidden;transform:translateY(24px) scale(.98);transition:opacity .45s var(--ease),transform .5s var(--ease),visibility 0s .5s}
#callui.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s var(--ease),transform .5s var(--ease)}
#callui .who{text-align:center}
#callui .who b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em}
#callui .who span{display:block;margin-top:6px;font-size:15px;color:#5b6674;min-height:22px}
#callui .who .tm{font-variant-numeric:tabular-nums;color:#8d96a3;font-size:13px;margin-top:2px}
.cv{position:relative;width:180px;height:180px;display:grid;place-items:center}
.cv i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95),rgba(255,255,255,0) 32%),radial-gradient(circle at 70% 75%,#7fd957,rgba(127,217,87,0) 62%),radial-gradient(circle at 30% 65%,#d6f496,#9be3b0 80%);box-shadow:inset 0 -14px 26px rgba(70,170,90,.25),0 18px 50px rgba(130,210,100,.4);animation:morph 5s ease-in-out infinite,hue 6s ease-in-out infinite alternate;filter:none}
.cv u{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(110,200,90,.5);opacity:0}
.cv.listen u{animation:ripple2 2.2s cubic-bezier(.2,.6,.3,1) infinite}
.cv.listen u:nth-of-type(2){animation-delay:.7s}.cv.listen u:nth-of-type(3){animation-delay:1.4s}
@keyframes ripple2{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.1);opacity:0}}
.cv.think i{background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.98) 0,rgba(255,255,255,0) 30%),conic-gradient(from 0deg,#ffe0cc,#ffbf99,#ffa9bd,#ffd6e4,#ffe8d6,#ffbf99,#ffe0cc);box-shadow:inset 0 -12px 22px rgba(255,110,150,.25),0 18px 50px rgba(255,170,120,.4);animation:morph 2.4s ease-in-out infinite,spin 3s linear infinite alternate}
.cv i{transition:box-shadow .5s}
.cv.speak i{animation:morph 3s ease-in-out infinite,hue 3s ease-in-out infinite alternate,vspeak .5s ease-in-out infinite}
@keyframes vspeak{0%,100%{scale:1}50%{scale:1.09}}
#callui .typed{width:100%;max-width:420px;display:none}
#callui.typing .typed{display:block}
#callui .typed input{width:100%;height:48px;border-radius:999px;border:1px solid var(--line);padding:0 20px;font:inherit;font-size:16px;background:#fff;outline:none;box-shadow:0 6px 24px rgba(120,160,200,.12)}
#callui .typed input:focus{border-color:#b7e08a}
.ctl{display:flex;gap:22px;align-items:center}
.ctl button{width:58px;height:58px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 6px 22px rgba(60,80,110,.14);transition:transform .3s var(--spring),background .2s}
.ctl button:active{transform:scale(.9)}
.ctl button[aria-pressed=true]{background:var(--ink);color:#fff}
.ctl #cend{width:68px;height:68px;background:#ff5a4d;color:#fff;box-shadow:0 10px 28px rgba(255,90,77,.4)}
#cnote{font-size:12.5px;color:#8d96a3;text-align:center;max-width:300px;min-height:16px}
@media(max-height:600px){.cv{width:120px;height:120px}#callui{padding-top:calc(28px + env(safe-area-inset-top))}}

/* talking effect */
.cv{--amp:.4}
.cv s{position:absolute;bottom:50%;left:50%;width:7px;height:10px;margin-left:calc((var(--k) - 2) * 14px - 3.5px);margin-bottom:-5px;border-radius:4px;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(60,150,70,.3);opacity:0;transform:scaleY(.4);transition:opacity .3s,transform .09s linear;z-index:2}
.cv.speak s{opacity:1;transform:scaleY(calc(.5 + var(--amp) * var(--m) * 4))}
.cv.speak i{animation:morph 3s ease-in-out infinite,hue 3s ease-in-out infinite alternate;scale:calc(1 + var(--amp) * .12);transition:scale .09s linear,box-shadow .2s;box-shadow:inset 0 -14px 26px rgba(70,170,90,.25),0 18px calc(40px + var(--amp) * 50px) rgba(130,210,100,.55)}
.cv.speak u{animation:ripple2 1.6s cubic-bezier(.2,.6,.3,1) infinite;border-color:rgba(110,200,90,.38)}
.cv.speak u:nth-of-type(2){animation-delay:.53s}.cv.speak u:nth-of-type(3){animation-delay:1.06s}
.orb.speak{animation:speak .45s ease-in-out infinite}

/* ported to the live receptionist */
.bubble{margin:0 0 22px;font-size:21px;line-height:1.32;font-weight:600;letter-spacing:-.022em;color:var(--ink);overflow-wrap:anywhere;animation:rise .45s cubic-bezier(.2,.8,.2,1) both;text-wrap:pretty}
.bubble::before{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:400;letter-spacing:0;color:var(--mute);margin-bottom:7px}
.bubble.you::before{content:"You"}
.bubble.ira::before{content:"Ira";background:none}
.bubble.ira{color:#232d3a}
.bubble.wa{font-size:15px;font-weight:500;line-height:1.45;letter-spacing:-.01em;background:linear-gradient(135deg,#f3fbe4,#eef9f1);border:1px solid #dcefc4;border-radius:20px;padding:14px 16px;color:#2b3a2a}
.bubble.wa::before{content:none}
.wa-head{font-size:11.5px;font-weight:600;color:#5d8a46;letter-spacing:.02em;margin-bottom:6px;text-transform:uppercase}
.hero .big{width:150px;height:150px;position:relative;margin-top:-30px}
.hero .big b{display:none}
#hero-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:340px}
#hero-chips button{border:0;background:var(--soft);color:#2b3542;font:inherit;font-size:14px;font-weight:500;border-radius:999px;min-height:44px;padding:0 16px;cursor:pointer;transition:background .2s,transform .3s var(--spring)}
#hero-chips button:hover{background:#e4e8f0}#hero-chips button:active{transform:scale(.96)}
#live{min-height:20px;padding:0 6px 8px;font-size:14px;color:#5b6674;text-align:center;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status{display:block;text-align:center;font-size:12.5px;color:#5b6674;padding:0 6px 6px;min-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#typed{text-align:left;width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);padding:18px 20px 6px;min-height:54px;caret-color:#3b82f6}
#typed::placeholder{color:#6b7684}
#mic{display:flex;align-items:center;gap:8px;height:44px;border:0;border-radius:999px;background:var(--soft);color:var(--ink);padding:0 16px 0 13px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s,transform .3s var(--spring),color .2s}
#mic:hover{background:#dff3b8}#mic:active{transform:scale(.95)}
#mic.live{background:#ff5a4d;color:#fff}
#mic svg{width:17px;height:17px}
#mic .wave{display:none}
.hr a.gh{font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--soft);border-radius:999px;height:44px;padding:0 15px;display:flex;align-items:center;transition:background .2s}
.hr a.gh:hover{background:#e4e8f0}
.ti em{font-style:normal}
#cu-live{max-width:420px;text-align:center;font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.3;min-height:56px;color:#2b3542;padding:0 8px}
#callui .ctl{justify-content:center}
#callui .who .tm{font-size:14px;color:#6b7684;margin-top:6px}
#callui.st-listening .cv u{animation:ripple2 2.2s cubic-bezier(.2,.6,.3,1) infinite}
</style>
</head>
<body>
<div id="app"><div id="chat">
<header>
  <div class="orb" id="orb"><b></b></div>
  <div class="ti"><strong>Ira</strong><span style="color:var(--mute)">Style Studio demo line</span></div>
  <div class="hr"><a class="gh" href="https://github.com/h55n/ira" target="_blank" rel="noopener">GitHub</a></div>
</header>
<div id="feed" data-empty="1" role="log" aria-live="polite" aria-label="Conversation with Ira">
  <div class="hero" id="hero"><div class="big"><b></b></div><p>Hi, main Ira. Salon ki booking, bas bol do ya type kar do.</p>
  <div id="hero-chips"><button type="button">Aaj shaam 6 baje facial available hai?</button><button type="button">Kal haircut book karna hai</button><button type="button">Meri booking reschedule karo</button></div></div>
</div>
<div id="dock">
  <div id="live" aria-live="polite"></div>
  <div id="status">Tap Call to talk, ya neeche type karein</div>
  <form id="f" onsubmit="return false">
    <input id="typed" placeholder="Type - Hindi, English, dono chalega" autocomplete="off" enterkeyhint="send">
    <div class="bar">
      <button type="button" id="mic" aria-label="Call Ira"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg><span>Call</span></button>
      <span id="hint">Hinglish &middot; Hindi &middot; English</span>
      <button type="button" id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </form>
</div>
<div id="callui" role="dialog" aria-label="Call with Ira">
  <div class="who"><b>Ira</b><span id="cu-state">Connecting...</span><div class="tm" id="cu-sub"></div></div>
  <div class="cv" id="cv"><u></u><u></u><u></u><i></i><s style="--k:0;--m:0.6"></s><s style="--k:1;--m:0.9"></s><s style="--k:2;--m:1"></s><s style="--k:3;--m:0.8"></s><s style="--k:4;--m:0.55"></s></div>
  <div id="cu-live" aria-live="polite"></div>
  <div class="ctl"><button id="cu-end" aria-label="End call"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path transform="rotate(135 12 12)" d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></button></div>
</div>
</div></div>
<script src="app.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  // hero chips: fill and send through the existing send button
  document.querySelectorAll('#hero-chips button').forEach(function(b){b.onclick=function(){$('typed').value=b.textContent;$('send').click();}});
  // map call states from app.js to the orb look
  var map={'st-listening':'listen','st-thinking':'think','st-speaking':'speak'},amp=0;
  new MutationObserver(function(){
    var c=$('callui').className,cv=$('cv'),s='';
    for(var k in map) if(c.indexOf(k)>-1) s=map[k];
    cv.className='cv '+s; clearInterval(amp);
    if(s==='speak') amp=setInterval(function(){cv.style.setProperty('--amp',(.15+Math.random()*.85).toFixed(2))},95); else cv.style.setProperty('--amp',.3);
  }).observe($('callui'),{attributes:true,attributeFilter:['class']});
  // header orb goes peach while Ira is thinking
  new MutationObserver(function(){var t=$('status').textContent;if(t==='Ira'){$('status').textContent='';return}$('orb').classList.toggle('think',/soch/i.test(t))}).observe($('status'),{childList:true,characterData:true,subtree:true});
  // pressed state on send
  $('typed').addEventListener('input',function(){$('f').classList.toggle('empty',!$('typed').value.trim())});$('f').classList.add('empty');$('send').addEventListener('click',function(){setTimeout(function(){$('f').classList.toggle('empty',!$('typed').value.trim())},60)});$('typed').addEventListener('keydown',function(e){if(e.key==='Enter')setTimeout(function(){$('f').classList.toggle('empty',!$('typed').value.trim())},60)});
})();
</script>
</body>
</html>
