<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ira - the receptionist that never misses a call</title>
<style>
  :root { --ink:#101418; --mut:#6b7480; --brand:#0f7b6c; }
  * { margin:0; box-sizing:border-box; font-family:Inter,system-ui,sans-serif; }
  body { background:#f6f7f8; color:var(--ink); display:grid; place-items:center; min-height:100vh; }
  .phone { width:min(420px,94vw); background:#fff; border-radius:28px; box-shadow:0 24px 60px rgba(16,20,24,.12); overflow:hidden; }
  header { padding:22px 24px 14px; }
  h1 { font-size:20px; letter-spacing:-.02em; }
  .sub { color:var(--mut); font-size:13px; margin-top:4px; }
  #status { padding:10px 24px; font-size:12px; color:var(--brand); min-height:34px; }
  #feed { height:320px; overflow-y:auto; padding:6px 20px 12px; display:flex; flex-direction:column; gap:8px; }
  .bubble { max-width:82%; padding:9px 13px; border-radius:16px; font-size:14px; line-height:1.4; animation:pop .18s ease-out; }
  .you { align-self:flex-end; background:#0f7b6c; color:#fff; border-bottom-right-radius:4px; }
  .ira { align-self:flex-start; background:#eef1f3; border-bottom-left-radius:4px; }
  #live { padding:0 24px; min-height:20px; font-size:13px; color:var(--mut); font-style:italic; }
  footer { display:flex; align-items:center; gap:10px; padding:14px 20px 20px; }
  #typed { flex:1; border:1px solid #e2e6ea; border-radius:999px; padding:10px 14px; font-size:14px; outline:none; }
  #send, #mic { border:none; cursor:pointer; border-radius:999px; font-size:14px; }
  #send { background:#eef1f3; padding:10px 16px; }
  #mic { background:var(--ink); color:#fff; padding:12px 18px; transition:background .2s; }
  #mic.live { background:#d64545; animation:pulse 1.6s infinite; }
  .wa { align-self:flex-start; background:#e7f6e9; border:1px solid #bfe5c7; border-bottom-left-radius:4px; white-space:pre-wrap; }
  .wa-head { font-size:11px; font-weight:600; color:#128c4b; margin-bottom:4px; letter-spacing:.01em; }
  @keyframes pop { from { transform:translateY(6px); opacity:0; } }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(214,69,69,.35);} 50% { box-shadow:0 0 0 10px rgba(214,69,69,0);} }
</style>
</head>
<body>
  <div class="phone">
    <header>
      <h1>Ira</h1>
      <div class="sub">Aapki dukaan ka receptionist - kabhi missed call nahi. Demo line: Style Studio, Pune.</div>
    </header>
    <div id="status">Tap the mic to call</div>
    <div id="feed"></div>
    <div id="live"></div>
    <footer>
      <input id="typed" placeholder="ya yahan type karein…">
      <button id="send">Send</button>
      <button id="mic">Call</button>
    </footer>
  </div>
<script src="app.js"></script>
</body>
</html>
